# Runs the dashboard typecheck, production build and Playwright UI tests on every PR and
# push to main that touches the dashboard. The tests mock the dashboard API, so no
# secrets are used.
name: Dashboard UI tests

on:
  pull_request:
    paths:
      - src/dashboard/**
      - .github/workflows/dashboard-ui-tests.yml
  push:
    branches: [main]
    paths:
      - src/dashboard/**
      - .github/workflows/dashboard-ui-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/dashboard/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: UI tests
        run: npm run test:ui

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            src/dashboard/playwright-report/
            src/dashboard/test-results/
          retention-days: 14
